  nginx:
    image: nginx:alpine
    container_name: salon-sandbox-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - salon-sandbox-network
    profiles:
      - webhook

networks:
  salon-sandbox-network:
    driver: bridge