version: '3.8'

services:
  client-1:
    build: ./code
    container_name: salon-sandbox-client-1
    command: python -u launcher.py --instance /instance --mode both
    restart: unless-stopped
    volumes:
      - ./instances/client-1:/instance
    networks:
      - salon-sandbox-network
    profiles:
      - client-1

  client-2:
    build: ./code
    container_name: salon-sandbox-client-2
