events {
    worker_connections 1024;
}

http {
    client_max_body_size 50M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;

    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name ttorchh.space;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Docker DNS — резолвит имена контейнеров на лету
        resolver 127.0.0.11 valid=10s ipv6=off;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;

        # client-1
        location /webhook/client-1/user {
            set $upstream http://salon-sandbox-client-1:8443;
            proxy_pass $upstream/webhook/client-1/user;
        }
        location /webhook/client-1/admin {
            set $upstream http://salon-sandbox-client-1:8444;
            proxy_pass $upstream/webhook/client-1/admin;
        }
        location /health/client-1/user  { set $upstream http://salon-sandbox-client-1:8443; proxy_pass $upstream/health; access_log off; }
        location /health/client-1/admin { set $upstream http://salon-sandbox-client-1:8444; proxy_pass $upstream/health; access_log off; }

        # client-2
        location /webhook/client-2/user {
            set $upstream http://salon-sandbox-client-2:8445;
            proxy_pass $upstream/webhook/client-2/user;
        }
        location /webhook/client-2/admin {
            set $upstream http://salon-sandbox-client-2:8446;
            proxy_pass $upstream/webhook/client-2/admin;
        }
        location /health/client-2/user  { set $upstream http://salon-sandbox-client-2:8445; proxy_pass $upstream/health; access_log off; }
        location /health/client-2/admin { set $upstream http://salon-sandbox-client-2:8446; proxy_pass $upstream/health; access_log off; }

        # client-3
        location /webhook/client-3/user {
            set $upstream http://salon-sandbox-client-3:8447;
            proxy_pass $upstream/webhook/client-3/user;
        }
        location /webhook/client-3/admin {
            set $upstream http://salon-sandbox-client-3:8448;
            proxy_pass $upstream/webhook/client-3/admin;
        }
        location /health/client-3/user  { set $upstream http://salon-sandbox-client-3:8447; proxy_pass $upstream/health; access_log off; }
        location /health/client-3/admin { set $upstream http://salon-sandbox-client-3:8448; proxy_pass $upstream/health; access_log off; }

        # client-4
        location /webhook/client-4/user {
            set $upstream http://salon-sandbox-client-4:8449;
            proxy_pass $upstream/webhook/client-4/user;
        }
        location /webhook/client-4/admin {
            set $upstream http://salon-sandbox-client-4:8450;
            proxy_pass $upstream/webhook/client-4/admin;
        }
        location /health/client-4/user  { set $upstream http://salon-sandbox-client-4:8449; proxy_pass $upstream/health; access_log off; }
        location /health/client-4/admin { set $upstream http://salon-sandbox-client-4:8450; proxy_pass $upstream/health; access_log off; }

        # client-5
        location /webhook/client-5/user {
            set $upstream http://salon-sandbox-client-5:8451;
