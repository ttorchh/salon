        }
        location /webhook/client-6/admin {
            set $upstream http://salon-sandbox-client-6:8454;
            proxy_pass $upstream/webhook/client-6/admin;
        }
        location /health/client-6/user  { set $upstream http://salon-sandbox-client-6:8453; proxy_pass $upstream/health; access_log off; }
        location /health/client-6/admin { set $upstream http://salon-sandbox-client-6:8454; proxy_pass $upstream/health; access_log off; }

        # client-7
        location /webhook/client-7/user {
            set $upstream http://salon-sandbox-client-7:8455;
            proxy_pass $upstream/webhook/client-7/user;
        }
        location /webhook/client-7/admin {
            set $upstream http://salon-sandbox-client-7:8456;
