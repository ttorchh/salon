        }
        location /health/client-7/user  { set $upstream http://salon-sandbox-client-7:8455; proxy_pass $upstream/health; access_log off; }
        location /health/client-7/admin { set $upstream http://salon-sandbox-client-7:8456; proxy_pass $upstream/health; access_log off; }

        # client-8
        location /webhook/client-8/user {
            set $upstream http://salon-sandbox-client-8:8457;
            proxy_pass $upstream/webhook/client-8/user;
        }
        location /webhook/client-8/admin {
            set $upstream http://salon-sandbox-client-8:8458;
            proxy_pass $upstream/webhook/client-8/admin;
        }
        location /health/client-8/user  { set $upstream http://salon-sandbox-client-8:8457; proxy_pass $upstream/health; access_log off; }
        location /health/client-8/admin { set $upstream http://salon-sandbox-client-8:8458; proxy_pass $upstream/health; access_log off; }

        # client-9
        location /webhook/client-9/user {
            set $upstream http://salon-sandbox-client-9:8459;
            proxy_pass $upstream/webhook/client-9/user;
        }
        location /webhook/client-9/admin {
            set $upstream http://salon-sandbox-client-9:8460;
            proxy_pass $upstream/webhook/client-9/admin;
        }
        location /health/client-9/user  { set $upstream http://salon-sandbox-client-9:8459; proxy_pass $upstream/health; access_log off; }
        location /health/client-9/admin { set $upstream http://salon-sandbox-client-9:8460; proxy_pass $upstream/health; access_log off; }

        # client-10
        location /webhook/client-10/user {
            set $upstream http://salon-sandbox-client-10:8461;
            proxy_pass $upstream/webhook/client-10/user;
        }
        location /webhook/client-10/admin {
            set $upstream http://salon-sandbox-client-10:8462;
            proxy_pass $upstream/webhook/client-10/admin;
        }
        location /health/client-10/user  { set $upstream http://salon-sandbox-client-10:8461; proxy_pass $upstream/health; access_log off; }
        location /health/client-10/admin { set $upstream http://salon-sandbox-client-10:8462; proxy_pass $upstream/health; access_log off; }

        location /status {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 404;
        }
    }
}
