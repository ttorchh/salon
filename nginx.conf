        }
        location /health/client-5/user  { set $upstream http://salon-sandbox-client-5:8451; proxy_pass $upstream/health; access_log off; }
        location /health/client-5/admin { set $upstream http://salon-sandbox-client-5:8452; proxy_pass $upstream/health; access_log off; }

        # client-6
        location /webhook/client-6/user {
